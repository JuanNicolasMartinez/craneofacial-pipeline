[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craneofacial-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "trimesh>=4.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "watchdog>=6.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
